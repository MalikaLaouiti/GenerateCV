<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion – Générateur de CV</title>
  <script>try{document.documentElement.dataset.theme=localStorage.getItem("cv-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light")}catch(e){}</script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="auth.css">
</head>
<body class="auth">
  <main class="auth__card">
    <h1 class="auth__brand"><i class="fa-solid fa-file-lines" aria-hidden="true"></i>Générateur de CV</h1>
    <p class="auth__sub">Retrouvez votre CV sur tous vos appareils.</p>

    <div class="auth__tabs" role="tablist">
      <button type="button" role="tab" data-mode="login" aria-selected="true">Connexion</button>
      <button type="button" role="tab" data-mode="register" aria-selected="false">Créer un compte</button>
    </div>

    <form id="f" novalidate>
      <p id="err" class="auth__err" role="alert"></p>

      <label class="field">
        <span>Adresse e-mail</span>
        <span class="field__box">
          <i class="fa-regular fa-envelope" aria-hidden="true"></i>
          <input type="email" name="email" required autocomplete="username" placeholder="vous@exemple.com">
        </span>
      </label>

      <label class="field">
        <span>Mot de passe</span>
        <span class="field__box">
          <i class="fa-solid fa-lock" aria-hidden="true"></i>
          <input type="password" name="password" required minlength="8" autocomplete="current-password" placeholder="••••••••">
          <button type="button" class="field__eye" aria-label="Afficher le mot de passe"><i class="fa-regular fa-eye" aria-hidden="true"></i></button>
        </span>
        <small id="hint" hidden>8 caractères minimum.</small>
      </label>

      <button type="submit" class="btn auth__submit"><span id="submit-label">Se connecter</span></button>
    </form>
  </main>

  <script>
    var f = document.getElementById('f'), err = document.getElementById('err'), mode = 'login';
    var tabs = document.querySelectorAll('[data-mode]'), btn = f.querySelector('.auth__submit');

    function setMode(m) {
      mode = m; err.textContent = '';
      tabs.forEach(function (t) { t.setAttribute('aria-selected', t.dataset.mode === m); });
      document.getElementById('submit-label').textContent = m === 'login' ? 'Se connecter' : 'Créer mon compte';
      document.getElementById('hint').hidden = m === 'login';
      f.password.autocomplete = m === 'login' ? 'current-password' : 'new-password';
      document.title = (m === 'login' ? 'Connexion' : 'Inscription') + ' – Générateur de CV';
    }
    tabs.forEach(function (t) { t.addEventListener('click', function () { setMode(t.dataset.mode); }); });

    f.querySelector('.field__eye').addEventListener('click', function (e) {
      var show = f.password.type === 'password';
      f.password.type = show ? 'text' : 'password';
      e.currentTarget.setAttribute('aria-label', show ? 'Masquer le mot de passe' : 'Afficher le mot de passe');
      e.currentTarget.firstChild.className = show ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye';
    });

    f.addEventListener('submit', function (e) {
      e.preventDefault();
      err.textContent = '';
      if (!f.email.validity.valid) { err.textContent = 'Adresse e-mail invalide.'; return f.email.focus(); }
      if (f.password.value.length < 8) { err.textContent = 'Le mot de passe doit contenir au moins 8 caractères.'; return f.password.focus(); }
      btn.disabled = true;
      fetch('api.php?a=' + mode, { method: 'POST', body: JSON.stringify({ email: f.email.value, password: f.password.value }) })
        .then(function (r) { return r.json().then(function (m) { if (r.ok) location.href = 'index.html'; else err.textContent = m; }); })
        .catch(function () { err.textContent = 'Serveur injoignable.'; })
        .then(function () { btn.disabled = false; });
    });
  </script>
</body>
</html>
